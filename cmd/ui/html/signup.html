{{ template "head" . }}
<div class="container-md">
{{ template "navbar" . }}
{{ if .Flash}}
    <h3 class="{{ or .MsgAlert.Message `alert alert-light` }}">
        {{ .Flash }}
    </h3>
{{ end }}
{{ block "signup" . }}
<form action="/user/signup" method="post" class="my-1">
    <div class="form-row">
        <div class="form-group mb-3">
            <label for="name"
                {{ if .Error.ErrorName }} class="text-danger"{{ end }}>
            Username{{ if .Error.ErrorName }} - {{ .Error.ErrorName }}{{ end }}</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <div class="form-group mb-3">
            <label for="email"{{ if .Error.ErrorEmail }} class="text-danger"{{ end }}>Email address{{ if .Error.ErrorEmail }} - {{ .Error.ErrorEmail }}{{ end }}</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="form-group mb-3">
            <label for="password"{{ if .Error.ErrorPassword }} class="text-danger"{{ end }}>Password{{ if .Error.ErrorPassword }} - {{ .Error.ErrorPassword }}{{ end }}</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>

    </div>
    <button type="submit" class="btn btn-primary">Sign Up</button>
</form>

{{ end }}


</div>


{{ template "footer" . }}
